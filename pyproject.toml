[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhquant-gui"
version = "0.1.0"
description = "DhQuant desktop GUI built with PySide6 and QML."
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
dhquant-gui = "dhquant_gui.main:main"

[tool.setuptools]
package-dir = {"" = "GUI"}

[tool.setuptools.packages.find]
where = ["GUI"]

[tool.setuptools.package-data]
dhquant_gui = ["qml/**/*.qml"]
