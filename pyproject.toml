[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhquant-gui"
version = "0.1.0"
description = "DhQuant desktop GUI built with PySide6 and QML."
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "dramatiq[redis]>=1.17",
    "structlog>=24.1",
    "httpx>=0.27",
    "pytest>=8.2",
    "pybind11>=2.12",
]

[project.scripts]
dhquant-gui = "dhquant_gui.main:main"

[tool.setuptools]
package-dir = {"" = "GUI"}

[tool.setuptools.packages.find]
where = ["GUI"]

[tool.setuptools.package-data]
dhquant_gui = ["qml/**/*.qml"]
